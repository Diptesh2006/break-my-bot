services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-breakmybot}
      POSTGRES_USER: ${POSTGRES_USER:-breakmybot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-breakmybot} -d ${POSTGRES_DB:-breakmybot}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: .
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BREAKMYBOT_DATA_DIR: /app/data
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-breakmybot}
      PGUSER: ${POSTGRES_USER:-breakmybot}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
      BREAKMYBOT_ALLOWED_HOSTS: ${BREAKMYBOT_ALLOWED_HOSTS:-host.docker.internal}
      BREAKMYBOT_DOCKER_MODE: "true"
      BREAKMYBOT_REQUEST_TIMEOUT_SECONDS: ${BREAKMYBOT_REQUEST_TIMEOUT_SECONDS:-15}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
  worker:
    build: .
    env_file:
      - path: .env
        required: false
    command: ["python", "-m", "breakmybot.worker"]
    environment:
      BREAKMYBOT_DATA_DIR: /app/data
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-breakmybot}
      PGUSER: ${POSTGRES_USER:-breakmybot}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
      BREAKMYBOT_ALLOWED_HOSTS: ${BREAKMYBOT_ALLOWED_HOSTS:-host.docker.internal}
      BREAKMYBOT_DOCKER_MODE: "true"
      BREAKMYBOT_REQUEST_TIMEOUT_SECONDS: ${BREAKMYBOT_REQUEST_TIMEOUT_SECONDS:-15}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  dashboard:
    build: ./dashboard
    environment:
      BREAKMYBOT_API_ORIGIN: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
