services:
  api:
    build: .
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BREAKMYBOT_DATA_DIR: /app/data
      BREAKMYBOT_ALLOWED_HOSTS: host.docker.internal
      BREAKMYBOT_DOCKER_MODE: "true"
      BREAKMYBOT_REQUEST_TIMEOUT_SECONDS: ${BREAKMYBOT_REQUEST_TIMEOUT_SECONDS:-15}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
