services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-breakmybot}
      POSTGRES_USER: ${POSTGRES_USER:-breakmybot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-breakmybot-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-breakmybot} -d ${POSTGRES_DB:-breakmybot}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: .
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BREAKMYBOT_DATA_DIR: /app/data
      BREAKMYBOT_DATABASE_URL: ${BREAKMYBOT_DATABASE_URL:-postgresql://${POSTGRES_USER:-breakmybot}:${POSTGRES_PASSWORD:-breakmybot-local-only}@postgres:5432/${POSTGRES_DB:-breakmybot}}
      BREAKMYBOT_ALLOWED_HOSTS: host.docker.internal
      BREAKMYBOT_DOCKER_MODE: "true"
      BREAKMYBOT_REQUEST_TIMEOUT_SECONDS: ${BREAKMYBOT_REQUEST_TIMEOUT_SECONDS:-15}
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build: .
    env_file:
      - path: .env
        required: false
    command: ["python", "-m", "breakmybot.worker"]
    environment:
      BREAKMYBOT_DATA_DIR: /app/data
      BREAKMYBOT_DATABASE_URL: ${BREAKMYBOT_DATABASE_URL:-postgresql://${POSTGRES_USER:-breakmybot}:${POSTGRES_PASSWORD:-breakmybot-local-only}@postgres:5432/${POSTGRES_DB:-breakmybot}}
      BREAKMYBOT_ALLOWED_HOSTS: host.docker.internal
      BREAKMYBOT_DOCKER_MODE: "true"
      BREAKMYBOT_REQUEST_TIMEOUT_SECONDS: ${BREAKMYBOT_REQUEST_TIMEOUT_SECONDS:-15}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  dashboard:
    build: ./dashboard
    environment:
      BREAKMYBOT_API_ORIGIN: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
